<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小组作业AI管家 · 小程序预览 Demo</title>
<style>
/* ============ 基础与手机框 ============ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  --indigo:#4F46E5; --indigo2:#6366F1; --purple:#9333EA;
  --s800:#1E293B; --s700:#334155; --s600:#475569; --s500:#64748B;
  --s400:#94A3B8; --s200:#E2E8F0; --s100:#F1F5F9; --s50:#F8FAFC;
  --green:#22C55E; --red:#EF4444; --amber:#F59E0B;
}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background:radial-gradient(1200px 800px at 20% -10%,#312e81 0%,#0f172a 55%,#020617 100%);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.phone{
  position:relative; width:375px; height:812px; background:var(--s50);
  border-radius:48px; overflow:hidden;
  box-shadow:0 40px 120px rgba(0,0,0,.55),0 0 0 10px #1e293b,0 0 0 12px #334155;
  display:flex; flex-direction:column;
}
.stage{position:relative; flex:1; overflow:hidden;}
.view{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; background:var(--s50);
  -webkit-overflow-scrolling:touch; display:none;}
.view.active{display:block; animation:fade .22s ease;}
@keyframes fade{from{opacity:0; transform:translateX(12px);}to{opacity:1; transform:none;}}
.view::-webkit-scrollbar{display:none;}

/* 状态栏 */
.statusbar{height:44px; display:flex; align-items:center; justify-content:space-between;
  padding:0 24px 0 28px; font-size:14px; font-weight:600; flex-shrink:0;}
.statusbar.dark{color:#fff;} .statusbar.light{color:#0f172a;}
.sb-icons{display:flex; align-items:center; gap:6px;}
.sb-icons svg{display:block;}

/* 胶囊 */
.capsule{position:absolute; top:52px; right:16px; width:87px; height:32px; border-radius:16px;
  border:1px solid rgba(0,0,0,.08); background:rgba(255,255,255,.7); backdrop-filter:blur(10px);
  display:flex; align-items:center; justify-content:space-around; z-index:80;}
.capsule .c-dot{width:16px; height:16px; border-radius:50%; border:1.6px solid #334155; position:relative;}
.capsule .c-dot::after{content:"··";position:absolute;left:3px;top:-4px;font-size:10px;letter-spacing:1px;}
.capsule .c-ring{width:16px; height:16px; border-radius:50%; border:1.6px solid #334155; position:relative;}
.capsule .c-ring::before,.capsule .c-ring::after{content:"";position:absolute;border:1.2px solid #334155;border-radius:2px;}
.capsule .c-ring::before{width:5px;height:5px;left:3.5px;top:3.5px;}
.capsule .c-ring::after{width:9px;height:9px;left:1.5px;top:1.5px;border-bottom-color:transparent;border-right-color:transparent;}
.capsule .c-line{width:1px;height:18px;background:rgba(0,0,0,.1);}

/* 导航栏（子页面） */
.navbar{height:44px; display:flex; align-items:center; padding:0 12px; position:relative; flex-shrink:0;}
.nav-back{width:36px;height:36px;border-radius:50%;background:var(--s100);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.nav-title{position:absolute;left:80px;right:80px;text-align:center;font-size:17px;font-weight:700;color:var(--s800);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-sub{position:absolute;left:80px;right:80px;top:30px;text-align:center;font-size:10px;color:var(--green);display:flex;align-items:center;justify-content:center;gap:4px;}
.nav-tools{margin-left:auto;display:flex;gap:8px;}
.nav-tools .tb{width:32px;height:32px;border-radius:50%;background:var(--s100);display:flex;align-items:center;justify-content:center;cursor:pointer;}

/* tabBar */
.tabbar{height:72px; background:#fff; border-top:1px solid var(--s100); display:flex; flex-shrink:0;
  padding-bottom:6px; z-index:90;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--s400);font-size:10px;}
.tab.on{color:var(--indigo);}
.tab img{width:24px;height:24px;}

/* ============ 通用 ============ */
.icon{display:inline-block;vertical-align:middle;}
.ava{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:600;flex-shrink:0;}
.ava-10{width:20px;height:20px;font-size:9px;} .ava-12{width:24px;height:24px;font-size:11px;}
.ava-14{width:28px;height:28px;font-size:12px;} .ava-20{width:40px;height:40px;font-size:16px;}
.ava-24{width:48px;height:48px;font-size:19px;} .ava-28{width:56px;height:56px;font-size:22px;}
.ava-40{width:80px;height:80px;font-size:32px;} .ava-48{width:96px;height:96px;font-size:38px;}
.ava-56{width:112px;height:112px;font-size:44px;}
.card{background:#fff;border:1px solid var(--s100);border-radius:16px;box-shadow:0 2px 6px rgba(15,23,42,.04);}
.ell{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.btn-primary{height:48px;border-radius:16px;background:var(--indigo);color:#fff;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 12px rgba(79,70,229,.18);cursor:pointer;border:none;width:100%;}
.btn-primary:active{opacity:.88; transform:scale(.99);}
.btn-dark{background:var(--s800);} .btn-green{background:var(--green);}
.press:active{transform:scale(.97);}

/* toast / modal */
#toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:rgba(15,23,42,.85);color:#fff;
  font-size:13px;padding:12px 20px;border-radius:12px;z-index:300;opacity:0;pointer-events:none;transition:.2s;max-width:260px;text-align:center;}
#toast.show{opacity:1;}
.modal-mask{position:absolute;inset:0;background:rgba(15,23,42,.55);z-index:200;display:flex;align-items:center;justify-content:center;}
.modal-card{width:300px;background:#fff;border-radius:32px;padding:32px 24px 24px;display:flex;flex-direction:column;align-items:center;}
.drawer-mask{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:200;}
.drawer{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:40px 40px 0 0;padding:16px 32px 24px;z-index:201;}
.grab{width:32px;height:4px;border-radius:99px;background:var(--s200);margin:0 auto 20px;}

/* ============ 首页 ============ */
.hero{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 0;}
.hero-date{font-size:14px;color:var(--s400);}
.hero-hi{font-size:24px;font-weight:700;color:var(--s800);margin-top:4px;}
.hero-ava{position:relative;}
.hero-dot{position:absolute;right:0;bottom:0;width:12px;height:12px;background:var(--green);border:2px solid #fff;border-radius:50%;}
.ddl{margin:24px 24px 0;padding:20px;border-radius:24px;background:linear-gradient(135deg,#6366F1,#9333EA);color:#fff;
  box-shadow:0 8px 16px rgba(99,102,241,.25);cursor:pointer;}
.ddl-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.ddl-badge{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:99px;font-size:12px;}
.ddl-title{display:block;font-size:18px;font-weight:700;}
.ddl-time{display:block;font-size:14px;color:rgba(255,255,255,.8);margin-top:4px;}
.ddl-track{margin-top:16px;height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;}
.ddl-inner{height:100%;background:#fff;border-radius:99px;}
.ddl-members{display:flex;margin-top:16px;}
.ddl-member{border:2px solid #818CF8;margin-left:-8px;}
.ddl-member:first-child{margin-left:0;}
.ddl-more{background:#A5B4FC !important;}
.quick{display:flex;gap:16px;padding:24px 24px 0;}
.quick-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:24px 12px;border-radius:24px;cursor:pointer;}
.quick-ico{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.q-green{background:#DCFCE7;} .q-blue{background:#DBEAFE;}
.quick-name{font-size:15px;font-weight:700;color:var(--s700);}
.quick-desc{font-size:10px;color:var(--s400);margin-top:4px;}
.section{padding:32px 24px 0;}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.sec-title{font-size:16px;font-weight:700;color:var(--s800);}
.sec-title-lg{font-size:18px;}
.sec-link{display:flex;align-items:center;font-size:12px;color:var(--indigo);cursor:pointer;}
.pj-row{display:flex;align-items:center;padding:16px;margin-bottom:12px;cursor:pointer;}
.pj-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-right:12px;}
.pj-main{flex:1;min-width:0;}
.pj-name{font-size:14px;font-weight:700;color:var(--s700);}
.pj-sub{font-size:10px;color:var(--s400);}
.pj-pct{font-size:12px;font-weight:700;}
.chat-card{display:flex;align-items:center;padding:16px;background:#EEF2FF;border:1px solid #E0E7FF;border-radius:16px;cursor:pointer;}
.chat-avas{display:flex;margin-right:16px;}
.chat-ava{border:2px solid #fff;margin-left:-10px;}
.chat-ava:first-child{margin-left:0;}
.chat-morec{background:var(--s200)!important;color:var(--s500);}
.chat-main{flex:1;min-width:0;}
.chat-name{font-size:14px;font-weight:700;color:var(--s800);}
.chat-last{font-size:11px;color:var(--indigo);margin-top:3px;}
.chat-right{display:flex;flex-direction:column;align-items:flex-end;margin-left:8px;}
.chat-time{font-size:10px;color:var(--s400);}
.chat-badge{margin-top:4px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--indigo);color:#fff;font-size:10px;
  display:flex;align-items:center;justify-content:center;}
.sec-head-sub{margin-top:32px;}
.ntf{display:flex;align-items:center;padding:16px;margin-bottom:12px;}
.ntf-ico{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-right:12px;}
.ntf-orange{background:#FFEDD5;} .ntf-green{background:#DCFCE7;}
.ntf-main{flex:1;min-width:0;}
.ntf-title{font-size:14px;font-weight:600;color:var(--s700);}
.ntf-desc{font-size:10px;color:var(--s400);margin-top:3px;}
.ntf-dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:8px;}
.tpl-wrap{padding:32px 0 24px;}
.tpl-head{padding:0 24px;}
.tpl-scroll{display:flex;gap:16px;padding:0 24px;overflow-x:auto;}
.tpl-scroll::-webkit-scrollbar{display:none;}
.tpl-card{flex-shrink:0;width:160px;padding:16px;background:#fff;border:1px solid var(--s100);border-radius:24px;cursor:pointer;}
.tpl-thumb{height:96px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.tpl-rose{background:#FFF1F2;} .tpl-cyan{background:#ECFEFF;} .tpl-amber{background:#FFFBEB;}
.tpl-name{font-size:14px;font-weight:700;color:var(--s700);}
.tpl-desc{font-size:10px;color:var(--s400);margin-top:4px;line-height:1.5;}

/* ============ 项目列表 ============ */
.pl-head{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#fff;border-bottom:1px solid var(--s100);}
.pl-title{font-size:20px;font-weight:700;color:var(--s800);}
.pl-actions{display:flex;gap:8px;}
.pl-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.pl-plain{background:#EEF2FF;} .pl-primary{background:var(--indigo);}
.chips{display:flex;gap:16px;padding:16px 24px;background:#fff;}
.chip{padding:6px 16px;border-radius:99px;background:var(--s100);color:var(--s500);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;}
.chip-on{background:var(--indigo);color:#fff;font-weight:700;}
.pcard{background:#fff;border:1px solid var(--s100);border-radius:32px;padding:20px;margin-bottom:16px;
  box-shadow:0 2px 6px rgba(15,23,42,.04);cursor:pointer;}
.pcard-done{opacity:.65;}
.pcard-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.badge{padding:4px 12px;border-radius:99px;font-size:10px;font-weight:700;}
.b-green{background:#DCFCE7;color:#15803D;} .b-blue{background:#DBEAFE;color:#1D4ED8;} .b-gray{background:#E2E8F0;color:#475569;}
.pcard-date{font-size:10px;color:var(--s400);}
.pcard-name{display:block;font-size:18px;font-weight:700;color:var(--s800);}
.pcard-done .pcard-name{color:var(--s400);}
.pcard-group{display:block;font-size:12px;color:var(--s500);margin:4px 0 16px;}
.pcard-foot{display:flex;justify-content:space-between;align-items:center;}
.stack{display:flex;}
.stack .ava{border:2px solid #fff;margin-left:-6px;box-shadow:0 1px 3px rgba(15,23,42,.08);}
.stack .ava:first-child{margin-left:0;}
.stack-more{background:var(--s100)!important;color:var(--s500);}
.pcard-progress{display:flex;align-items:center;font-size:12px;font-weight:700;color:var(--indigo);}

/* ============ 作业详情 ============ */
.steps{background:#fff;border-bottom:1px solid var(--s50);white-space:nowrap;overflow-x:auto;}
.steps::-webkit-scrollbar{display:none;}
.steps-inner{display:inline-flex;align-items:center;padding:16px 24px;}
.step{display:inline-flex;flex-direction:column;align-items:center;cursor:pointer;}
.step-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;}
.dot-now{background:var(--indigo);color:#fff;} .dot-done{background:var(--green);color:#fff;} .dot-todo{background:var(--s200);color:var(--s500);}
.step-label{font-size:10px;margin-top:4px;}
.label-now{color:var(--indigo);font-weight:700;} .label-done{color:#16A34A;font-weight:700;} .label-todo{color:var(--s400);}
.step-line{width:32px;height:1px;background:var(--s200);margin:0 12px 16px;}
.line-done{background:var(--green);}
.detail-body{padding:24px 24px 120px;}
.cta{margin-top:40px;}
.block-title{display:block;font-size:14px;font-weight:700;color:var(--s800);}
.stage-card{background:var(--indigo);border-radius:24px;padding:24px;color:#fff;margin-bottom:24px;}
.stage-tag{font-size:12px;color:#E0E7FF;}
.stage-title{display:block;font-size:20px;font-weight:700;margin:4px 0 16px;}
.stage-row{display:flex;align-items:center;gap:8px;background:rgba(99,102,241,.3);padding:12px;border-radius:16px;font-size:12px;}
.upload-box{border:2px dashed var(--s200);border-radius:24px;background:#fff;padding:40px 24px;display:flex;flex-direction:column;align-items:center;margin-bottom:16px;cursor:pointer;}
.upload-ico{width:64px;height:64px;border-radius:50%;background:#EEF2FF;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.upload-title{font-size:14px;font-weight:700;color:var(--s700);}
.upload-sub{font-size:10px;color:var(--s400);margin-top:4px;}
.example{display:flex;align-items:center;padding:16px;margin-top:12px;}
.example-ico{width:40px;height:40px;border-radius:8px;background:#FEF2F2;display:flex;align-items:center;justify-content:center;margin-right:12px;}
.example-main{flex:1;min-width:0;}
.example-name{font-size:12px;font-weight:700;color:var(--s700);}
.example-meta{font-size:10px;color:var(--s400);}
.example-eye{padding:8px;cursor:pointer;}
.state-head{display:flex;align-items:center;gap:8px;margin-bottom:24px;}
.state-head-ico{width:32px;height:32px;border-radius:8px;background:#EEF2FF;display:flex;align-items:center;justify-content:center;}
.sh-green{background:#DCFCE7;}
.state-head-title{font-size:16px;font-weight:700;color:var(--s800);}
.task-card{position:relative;background:#fff;border:1px solid var(--s100);border-radius:16px;padding:16px;margin-bottom:16px;
  box-shadow:0 2px 6px rgba(15,23,42,.04);overflow:hidden;}
.task-priority{border-color:#E0E7FF;}
.task-dim{opacity:.6;}
.task-flag{position:absolute;top:0;right:0;background:var(--indigo);color:#fff;font-size:10px;font-weight:700;padding:4px 12px;border-bottom-left-radius:12px;}
.task-name{display:block;font-size:15px;font-weight:700;color:var(--s800);padding-right:48px;}
.task-desc{display:block;font-size:10px;color:var(--s500);line-height:1.7;margin:8px 0 16px;}
.task-ddl{font-size:10px;color:var(--s400);}
.task-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.task-owners{display:flex;align-items:center;gap:4px;}
.task-owners-text{font-size:10px;color:var(--s400);}
.text-indigo{color:var(--indigo);font-weight:700;}
.task-claim{font-size:10px;color:var(--indigo);padding:4px 8px;cursor:pointer;}
.task-claimed{color:var(--s400);}
.contract-tip{margin-top:16px;padding:16px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:16px;}
.contract-text{font-size:10px;color:#B45309;font-style:italic;}
.board-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.online{display:flex;align-items:center;gap:4px;}
.online-dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
.online-text{font-size:10px;color:var(--s400);}
.board-hint{background:#EEF2FF;border:1px solid rgba(224,231,255,.8);border-radius:8px;padding:8px;font-size:10px;color:var(--s500);margin-bottom:24px;}
.board-col{margin-bottom:24px;}
.col-title{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:14px;font-weight:700;color:var(--s700);}
.col-bar{width:6px;height:16px;border-radius:99px;}
.cb-indigo{background:var(--indigo2);} .cb-slate{background:#CBD5E1;}
.kanban-card{padding:16px;margin-bottom:12px;}
.kanban-top{display:flex;justify-content:space-between;align-items:center;}
.kanban-name{font-size:14px;font-weight:700;color:var(--s800);}
.kanban-pct{font-size:10px;color:var(--indigo2);}
.mini-track{height:6px;background:var(--s100);border-radius:99px;margin:12px 0;overflow:hidden;}
.mini-inner{height:100%;background:var(--indigo2);border-radius:99px;}
.kanban-foot{display:flex;justify-content:space-between;align-items:center;}
.kanban-actions{display:flex;align-items:center;gap:8px;}
.quick-submit{background:#EEF2FF;color:var(--indigo);font-size:10px;font-weight:700;padding:4px 8px;border-radius:8px;cursor:pointer;}
.kanban-deadline{font-size:10px;color:var(--s400);}
.deadline-urgent{color:var(--red);font-weight:700;}
.todo-card{background:rgba(241,245,249,.5);border:1px dashed var(--s200);border-radius:16px;padding:16px;
  display:flex;justify-content:space-between;align-items:center;}
.todo-text{font-size:12px;color:var(--s400);}
.quick-hint{display:flex;align-items:flex-start;gap:8px;padding:12px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:16px;margin-bottom:16px;}
.quick-hint-title{display:block;font-size:11px;font-weight:700;color:#92400E;}
.quick-hint-sub{display:block;font-size:10px;color:#B45309;margin-top:2px;}
.submit-title{display:block;font-size:20px;font-weight:700;color:var(--s800);}
.submit-sub{display:block;font-size:12px;color:var(--s400);margin:8px 0 24px;}
.submit-task{color:var(--indigo);font-weight:700;}
.submit-box{background:#EEF2FF;border:2px dashed #C7D2FE;border-radius:24px;padding:32px 24px;display:flex;flex-direction:column;align-items:center;margin-bottom:16px;cursor:pointer;}
.submit-box-title{font-size:14px;font-weight:700;color:var(--s700);text-align:center;margin-top:16px;}
.submit-box-sub{font-size:10px;color:var(--s400);margin-top:4px;}
.files-card{padding:16px;}
.files-head{margin-bottom:12px;}
.file-row{display:flex;align-items:center;gap:12px;background:var(--s50);border-radius:12px;padding:12px;}
.file-main{flex:1;min-width:0;}
.file-name{font-size:12px;font-weight:700;color:var(--s700);}
.file-meta{font-size:10px;color:var(--s400);margin-top:2px;}
.summary-card{padding:24px;margin-bottom:16px;}
.summary-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.summary-tag{font-size:10px;background:#EEF2FF;color:var(--indigo);padding:4px 8px;border-radius:8px;}
.skeleton{display:flex;flex-direction:column;gap:12px;opacity:.6;}
.sk-bar{height:16px;background:var(--s100);border-radius:99px;}
.export-grid{display:flex;gap:16px;}
.export-item{flex:1;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;}
.export-label{font-size:10px;font-weight:700;color:var(--s600);}
.rate-card{padding:16px;}
.rate-top{display:flex;justify-content:space-between;align-items:center;}
.rate-user{display:flex;align-items:center;gap:12px;}
.rate-name{font-size:15px;font-weight:700;color:var(--s700);}
.stars{display:flex;gap:4px;}
.star{padding:4px;cursor:pointer;}
.rate-comment{margin-top:16px;background:var(--s50);border-radius:12px;padding:12px;font-size:10px;color:var(--s500);font-style:italic;}
.fab{position:absolute;right:24px;bottom:24px;width:56px;height:56px;border-radius:50%;background:var(--indigo);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px rgba(99,102,241,.35);z-index:50;cursor:pointer;}
.fab-badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 4px;border-radius:99px;background:var(--red);
  border:2px solid #fff;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}

/* ============ 消息列表 ============ */
.cl-head{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;}
.cl-title{font-size:20px;font-weight:700;color:var(--s800);}
.cl-actions{display:flex;gap:12px;}
.cl-btn{width:36px;height:36px;border-radius:50%;background:var(--s100);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.search-wrap{padding:0 24px 12px;}
.search-box{display:flex;align-items:center;gap:8px;height:40px;background:var(--s100);border-radius:99px;padding:0 16px;}
.search-box input{flex:1;border:none;outline:none;background:transparent;font-size:12px;color:var(--s800);}
.chat-row{display:flex;align-items:center;padding:16px 24px;border-bottom:1px solid var(--s50);cursor:pointer;}
.chat-row:active{opacity:.8;}
.chat-logo{position:relative;display:flex;align-items:center;height:48px;}
.chat-tile{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;}
.unread{position:absolute;top:-4px;right:-6px;min-width:20px;height:20px;padding:0 4px;border-radius:99px;background:var(--red);
  border:2px solid #fff;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.chatm{flex:1;min-width:0;margin-left:16px;}
.chatm-top{display:flex;justify-content:space-between;align-items:center;}
.chatm-name{font-size:16px;font-weight:700;color:var(--s800);}
.chatm-time{font-size:10px;color:var(--s400);}
.chatm-last{font-size:12px;color:var(--s500);margin-top:4px;}

/* ============ 群聊详情 ============ */
.cd-page{height:100%;display:flex;flex-direction:column;background:var(--s50);}
.cd-messages{flex:1;overflow-y:auto;padding:16px 24px;}
.cd-messages::-webkit-scrollbar{display:none;}
.msg-time{text-align:center;margin:12px 0;}
.msg-time span{background:rgba(148,163,184,.2);color:var(--s500);font-size:10px;padding:4px 12px;border-radius:99px;}
.msg-row{display:flex;align-items:flex-start;margin-bottom:16px;}
.msg-left{justify-content:flex-start;} .msg-right{justify-content:flex-end;}
.bubble{max-width:240px;padding:12px;font-size:12px;line-height:1.6;word-break:break-all;}
.bubble-left{background:#fff;color:var(--s700);border-radius:4px 16px 16px 16px;margin-left:10px;box-shadow:0 1px 4px rgba(15,23,42,.04);}
.bubble-right{background:var(--indigo2);color:#fff;border-radius:16px 4px 16px 16px;margin-right:10px;}
.cd-inputbar{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:8px 16px;background:#fff;border-top:1px solid var(--s100);}
.cd-input{flex:1;height:36px;background:var(--s100);border-radius:99px;padding:0 16px;font-size:12px;border:none;outline:none;}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--indigo2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.members-panel{position:absolute;top:96px;right:12px;width:280px;background:#fff;border-radius:16px;
  box-shadow:0 8px 24px rgba(15,23,42,.15);padding:16px;z-index:60;}
.members-head{padding-bottom:12px;border-bottom:1px solid var(--s100);font-size:12px;font-weight:700;color:var(--s800);}
.members-grid{display:flex;flex-wrap:wrap;padding-top:12px;}
.member-item{width:33.33%;display:flex;flex-direction:column;align-items:center;margin-bottom:12px;}
.member-ava-wrap{position:relative;}
.member-badge{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--indigo);color:#fff;
  font-size:8px;padding:1px 6px;border-radius:99px;white-space:nowrap;}
.member-name{font-size:10px;color:var(--s500);margin-top:6px;max-width:60px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.member-add{width:40px;height:40px;border-radius:50%;border:2px dashed #C7D2FE;background:#EEF2FF;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.qr-card{width:300px;background:#fff;border-radius:32px;padding:32px 24px 24px;display:flex;flex-direction:column;align-items:center;}
.qr-title{font-size:18px;font-weight:700;color:var(--s800);}
.qr-sub{font-size:11px;color:var(--s400);margin-top:4px;}
.qr-box{width:200px;height:200px;margin:20px 0;padding:8px;border:1px solid var(--s200);border-radius:12px;}
.qr-grid{display:flex;flex-direction:column;width:100%;height:100%;}
.qr-line{display:flex;flex:1;}
.qr-cell{flex:1;}
.qr-cell-on{background:#0F172A;}
.qr-code-row{display:flex;align-items:center;margin-bottom:20px;}
.qr-code-label{font-size:12px;color:var(--s500);}
.qr-code{font-size:16px;font-weight:700;color:var(--indigo);letter-spacing:4px;}
.qr-copy{margin-left:12px;font-size:11px;color:var(--indigo);background:#EEF2FF;padding:4px 12px;border-radius:99px;cursor:pointer;}
.qr-actions{display:flex;gap:12px;width:100%;}
.qr-btn{flex:1;height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;}
.qr-ghost{background:var(--s100);color:var(--s600);} .qr-dark{background:var(--s800);color:#fff;}

/* ============ 我的 ============ */
.pf-hero{background:linear-gradient(135deg,#6366F1,#9333EA);border-bottom-left-radius:40px;border-bottom-right-radius:40px;padding:12px 32px 40px;}
.pf-row{display:flex;justify-content:space-between;align-items:center;}
.pf-user{display:flex;align-items:center;}
.pf-ava-wrap{position:relative;margin-right:16px;}
.pf-ava{border:3px solid rgba(255,255,255,.35);}
.pf-check{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--green);
  border:2px solid #fff;display:flex;align-items:center;justify-content:center;}
.pf-name{font-size:18px;font-weight:700;color:#fff;}
.pf-school{font-size:10px;color:rgba(255,255,255,.7);margin-top:4px;}
.pf-settings{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.pf-stats{display:flex;margin-top:24px;}
.pf-stat{flex:1;display:flex;flex-direction:column;align-items:center;}
.pf-stat-num{font-size:20px;font-weight:700;color:#fff;}
.pf-stat-label{font-size:10px;color:rgba(255,255,255,.7);margin-top:4px;}
.pf-body{padding:0 24px;margin-top:-20px;padding-bottom:40px;}
.pf-card{padding:20px;}
.pf-card-head{display:flex;align-items:center;gap:8px;}
.radar-svg{display:block;width:100%;height:210px;margin:8px 0;}
.radar-note{display:block;text-align:center;font-size:10px;color:var(--s400);font-style:italic;}
.pf-block{margin-top:16px;padding:20px;}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.tag{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:99px;border:1px solid transparent;font-size:10px;font-weight:700;}
.t-blue{background:#EFF6FF;border-color:#DBEAFE;color:#1D4ED8;}
.t-rose{background:#FFF1F2;border-color:#FECDD3;color:#BE123C;}
.t-green{background:#F0FDF4;border-color:#BBF7D0;color:#15803D;}
.t-amber{background:#FFFBEB;border-color:#FDE68A;color:#B45309;}
.t-purple{background:#FAF5FF;border-color:#E9D5FF;color:#7E22CE;}
.history-head{display:flex;justify-content:space-between;align-items:center;}
.view-all{display:flex;align-items:center;font-size:11px;color:var(--s400);cursor:pointer;}
.history-item{display:flex;align-items:center;margin-top:16px;cursor:pointer;}
.history-dim{opacity:.55;}
.history-tile{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-right:12px;}
.ht-indigo{background:#EEF2FF;} .ht-emerald{background:#ECFDF5;} .ht-slate{background:var(--s100);}
.history-main{flex:1;min-width:0;}
.history-name{font-size:14px;font-weight:700;color:var(--s700);}
.history-desc{font-size:10px;color:var(--s400);margin-top:2px;}
.menu-item{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--s50);cursor:pointer;}
.menu-left{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--s700);}
.menu-ico{width:32px;height:32px;border-radius:8px;background:var(--s50);display:flex;align-items:center;justify-content:center;}
.menu-danger{color:var(--red);}

/* ============ 邀请成员 ============ */
.pc-body{padding:24px;padding-bottom:140px;}
.pc-intro{display:flex;flex-direction:column;align-items:center;padding:24px 0 32px;}
.pc-intro-ico{width:80px;height:80px;border-radius:24px;background:#EEF2FF;display:flex;align-items:center;justify-content:center;}
.pc-intro-title{font-size:20px;font-weight:700;color:var(--s800);margin-top:16px;}
.pc-intro-sub{font-size:13px;color:var(--s400);margin-top:6px;}
.methods{display:flex;flex-direction:column;gap:16px;}
.method{display:flex;align-items:center;padding:16px;cursor:pointer;}
.method-tile{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-right:12px;flex-shrink:0;}
.m-green{background:#F0FDF4;} .m-blue{background:#EFF6FF;} .m-orange{background:#FFF7ED;}
.method-main{flex:1;min-width:0;}
.method-name{font-size:14px;font-weight:700;color:var(--s800);}
.method-desc{font-size:10px;color:var(--s400);margin-top:2px;}
.method-code{font-size:16px;font-weight:700;color:#EA580C;letter-spacing:2px;margin-top:2px;}
.copy-btn{background:var(--indigo);color:#fff;font-size:11px;font-weight:700;padding:6px 16px;border-radius:99px;cursor:pointer;}
.joined-title{display:block;font-size:14px;font-weight:700;color:var(--s800);margin:28px 0 16px;}
.joined{display:flex;gap:24px;}
.joined-item{display:flex;flex-direction:column;align-items:center;}
.joined-ava-wrap{position:relative;}
.joined-badge{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--indigo);color:#fff;
  font-size:9px;padding:1px 6px;border-radius:99px;white-space:nowrap;}
.joined-name{font-size:11px;color:var(--s600);margin-top:8px;}
.joined-placeholder{width:48px;height:48px;border-radius:50%;border:2px dashed #CBD5E1;background:#fff;display:flex;align-items:center;justify-content:center;}
.joined-placeholder-text{color:var(--s400);}
.pc-bottom{position:absolute;left:0;right:0;bottom:0;background:#fff;padding:12px 24px 20px;box-shadow:0 -4px 12px rgba(15,23,42,.06);z-index:50;}
.pc-note{display:block;text-align:center;font-size:10px;color:var(--s400);margin-bottom:8px;}

/* ============ 扫码 ============ */
.scan-page{position:absolute;inset:0;background:#0F172A;display:flex;flex-direction:column;z-index:100;}
.scan-head{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;}
.scan-title{font-size:17px;font-weight:700;color:#fff;}
.head-circle{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.scan-zone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.frame{position:relative;width:260px;height:260px;border-radius:24px;background:rgba(255,255,255,.04);
  border:2px solid rgba(255,255,255,.15);overflow:hidden;cursor:pointer;}
.corner{position:absolute;width:24px;height:24px;}
.c-tl{top:12px;left:12px;border-top:4px solid var(--indigo2);border-left:4px solid var(--indigo2);border-top-left-radius:8px;}
.c-tr{top:12px;right:12px;border-top:4px solid var(--indigo2);border-right:4px solid var(--indigo2);border-top-right-radius:8px;}
.c-bl{bottom:12px;left:12px;border-bottom:4px solid var(--indigo2);border-left:4px solid var(--indigo2);border-bottom-left-radius:8px;}
.c-br{bottom:12px;right:12px;border-bottom:4px solid var(--indigo2);border-right:4px solid var(--indigo2);border-bottom-right-radius:8px;}
.scan-line{position:absolute;left:16px;right:16px;top:0;height:3px;border-radius:99px;
  background:linear-gradient(90deg,rgba(99,102,241,0),#818CF8,rgba(99,102,241,0));
  box-shadow:0 0 12px 4px rgba(99,102,241,.5);animation:scanMove 2.4s ease-in-out infinite;}
@keyframes scanMove{0%{transform:translateY(12px);}50%{transform:translateY(236px);}100%{transform:translateY(12px);}}
.scan-hint{font-size:12px;color:rgba(255,255,255,.6);margin-top:24px;}
.scan-actions{display:flex;justify-content:center;gap:48px;padding:16px 0 32px;}
.action-item{display:flex;flex-direction:column;align-items:center;cursor:pointer;}
.action-circle{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.ac-plain{background:rgba(255,255,255,.12);} .ac-primary{background:var(--indigo);}
.action-label{font-size:10px;color:rgba(255,255,255,.6);margin-top:8px;}
.drawer-title{display:block;font-size:18px;font-weight:700;color:var(--s800);text-align:center;}
.drawer-sub{display:block;font-size:12px;color:var(--s400);text-align:center;margin-top:4px;}
.code-boxes{position:relative;display:flex;justify-content:space-between;margin-top:20px;}
.code-cell{width:44px;height:56px;border:2px solid var(--s200);border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;color:var(--s800);}
.cell-active{border-color:var(--indigo2);box-shadow:0 0 0 4px rgba(99,102,241,.12);}
.code-real{position:absolute;inset:0;width:100%;opacity:0;}
.drawer-cta{margin-top:24px;}
.drawer-cancel{text-align:center;font-size:13px;color:var(--s400);padding:12px;cursor:pointer;}

@media (max-width:430px){
  body{background:#0f172a;}
  .phone{width:100vw;height:100vh;border-radius:0;box-shadow:none;}
}

function radarSVG(data){
  const size=300,cx=150,cy=150,R=96,N=data.length;
  const ang=i=>(-90+360/N*i)*Math.PI/180;
  const pt=(i,r)=>[cx+R*r*Math.cos(ang(i)),cy+R*r*Math.sin(ang(i))];
  let grid='';
  for(let lv=1;lv<=4;lv++){const r=lv/4;grid+=`<polygon points="${data.map((_,i)=>pt(i,r).join(',')).join(' ')}" fill="none" stroke="rgba(99,102,241,.15)"/>`;}
  const axes=data.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${pt(i,1)[0]}" y2="${pt(i,1)[1]}" stroke="rgba(99,102,241,.15)"/>`).join('');
  const poly=data.map((d,i)=>pt(i,d.value/5).join(',')).join(' ');
  const dots=data.map((d,i)=>{const[x,y]=pt(i,d.value/5);return`<circle cx="${x}" cy="${y}" r="4" fill="#6366F1"/><circle cx="${x}" cy="${y}" r="7" fill="none" stroke="rgba(99,102,241,.25)"/>`;}).join('');
  const labels=data.map((d,i)=>{const[x,y]=pt(i,1.2);const a=ang(i);const anchor=Math.cos(a)>.3?'start':(Math.cos(a)<-.3?'end':'middle');
    return`<text x="${x}" y="${y+4}" text-anchor="${anchor}" font-size="12" fill="#94A3B8">${d.name}</text>`;}).join('');
  return `<svg class="radar-svg" viewBox="0 0 300 300">${grid}${axes}<polygon points="${poly}" fill="rgba(99,102,241,.2)" stroke="#6366F1" stroke-width="2"/>${dots}${labels}</svg>`;
}

function qrMatrix(code){
  let h=2166136261;for(let i=0;i<code.length;i++)h=Math.imul(h^code.charCodeAt(i),16777619);
  const rnd=()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};
  const N=25,rows=[];
  const finder=(r,c)=>(r<7&&c<7)||(r<7&&c>=N-7)||(r>=N-7&&c<7);
  const fOn=(r,c)=>r===0||r===6||c===0||c===6||(r>=2&&r<=4&&c>=2&&c<=4);
  for(let r=0;r<N;r++){let row='';for(let c=0;c<N;c++){let on;
    if(finder(r,c)){const rr=r>=N-7?r-(N-7):r,cc=c>=N-7?c-(N-7):c;on=fOn(rr,cc);}else on=rnd()>.55;row+=on?'1':'0';}rows.push(row);}
  return rows;
}

      <span class="nav-sub"><span style="width:5px;height:5px;border-radius:50%;background:#22C55E;display:inline-block"></span>${c.online} 人在线</span>
      <div class="nav-tools">

      </div></div>
    <div class="cd-messages" id="cdMsg">

        if(m.type==='left')return`<div class="msg-row msg-left">${ava(m,'ava ava-20')}<div class="bubble bubble-left">${m.text}</div></div>`;
        return`<div class="msg-row msg-right"><div class="bubble bubble-right">${m.text}</div>${ava(m,'ava ava-20')}</div>`;
      }).join('')}
    </div>
    <div class="cd-inputbar">
      <span style="cursor:pointer;padding:4px" onclick="attachFile()">${icon('paperclip','slate-400',24)}</span>
      <input class="cd-input" id="cdInput" placeholder="输入消息..." value="${chatState.input.replace(/"/g,'&quot;')}"
        oninput="chatState.input=this.value" onkeydown="if(event.key==='Enter')sendMsg()">
      <span class="send-btn" onclick="sendMsg()">${icon('send','white',20)}</span>
    </div>
    ${chatState.showMembers?`
      <div style="position:absolute;inset:0;z-index:55" onclick="chatState.showMembers=false;render()"></div>
      <div class="members-panel" onclick="event.stopPropagation()">
        <div class="members-head">群组成员 (${c.memberCount})</div>
        <div class="members-grid">
          ${c.members.map(m=>`<div class="member-item"><div class="member-ava-wrap">${ava(m,'ava ava-20')}
            ${m.role?`<span class="member-badge">${m.role}</span>`:''}</div><span class="member-name">${m.name}</span></div>`).join('')}
          <div class="member-item" onclick="chatState.showMembers=false;chatState.showQR=true;render()">
            <div class="member-add">${icon('plus','indigo-500',18)}</div><span style="font-size:10px;color:#6366F1;margin-top:6px">邀请</span></div>
        </div></div>`:''}
    ${chatState.showQR?qrModal():''}

function qrModal(){
  const rows=qrMatrix(INVITE);
  return `<div class="modal-mask" onclick="chatState.showQR=false;render()">

      <span class="qr-title">小组邀请码</span><span class="qr-sub">扫描二维码即可快速加入小组</span>

        ${rows.map(r=>`<div class="qr-line">${r.split('').map(x=>`<div class="qr-cell ${x==='1'?'qr-cell-on':''}"></div>`).join('')}</div>`).join('')}
      </div></div>
      <div class="qr-code-row"><span class="qr-code-label">邀请码：</span><span class="qr-code">${INVITE}</span>
        <span class="qr-copy" onclick="copyText('${INVITE}')">复制</span></div>
      <div class="qr-actions">
        <div class="qr-btn qr-ghost" onclick="toast('已保存到相册（演示）')">保存图片</div>
        <div class="qr-btn qr-dark" onclick="chatState.showQR=false;render()">关闭</div></div>

function sendMsg(){
  const v=chatState.input.trim();if(!v)return;
  chatMessages.push({id:'me'+Date.now(),type:'right',sender:'我',short:'张',color:'#6366F1',text:v});
  chatState.input='';render();
  setTimeout(()=>{chatMessages.push({id:'li'+Date.now(),type:'left',sender:'李华',short:'李',color:'#F59E0B',text:'赞同！'});render();},1000);
}
function attachFile(){const name=prompt('模拟选择附件（输入文件名）','小组分工表.docx');if(!name)return;

        <input class="code-real" autofocus maxlength="6" value="${scanState.code}"
          oninput="scanState.code=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);this.value=scanState.code;renderCodeInput()"
          onkeydown="if(event.key==='Enter')joinByCode()">
      </div>
      <button class="btn-primary drawer-cta" onclick="joinByCode()">加入小组</button>
      <div class="drawer-cancel" onclick="scanState.drawer=false;scanState.code='';render()">取消</div>

function renderCodeInput(){render();const inp=document.querySelector('.code-real');if(inp){inp.focus();const v=inp.value;inp.setSelectionRange(v.length,v.length);}}
function scanSuccess(){toast('扫码成功，正在加入');setTimeout(()=>{scanState.drawer=false;scanState.code='';switchTab('home');},800);}
function joinByCode(){if(scanState.code.length<6){toast('请输入 6 位邀请码');return;}toast('加入成功');setTimeout(()=>{scanState.drawer=false;scanState.code='';switchTab('home');},800);}

/* ================= 渲染 ================= */
function tabbarHTML(){
  const items=[['home','home','首页'],['projects','layers','项目'],['messages','message','消息'],['me','user','我的']];
  return items.map(([k,ic,t])=>`
    <div class="tab ${tab===k?'on':''}" onclick="switchTab('${k}')">
      <img src="${ASSETS['tab/'+ic+(tab===k?'-active':'')+'.png']}"><span>${t}</span>
    </div>`).join('');
}
function render(){
  const stage=$('#stage');
  let html='';
  if(stack.length){
    const top=stack[stack.length-1];
    html = top.page==='detail'?detailView(top.params)
         : top.page==='chat'?chatView(top.params)
         : top.page==='create'?createView()
         : top.page==='scan'?scanView():'';
  }else{
    html = tab==='home'?homeView() : tab==='projects'?projectsView()
         : tab==='messages'?messagesView() : meView();
  }
  stage.innerHTML=html;
  $('#tabbar').style.display = stack.length?'none':'flex';
  $('#tabbar').innerHTML=tabbarHTML();
  // 群聊自动滚到底
  const msg=$('#cdMsg'); if(msg) msg.scrollTop=msg.scrollHeight;
  // 倒计时
  const cd=$('#countdown');
}
setInterval(()=>{const cd=$('#countdown');if(cd&&tab==='home'&&!stack.length)cd.textContent=countdown(projects[0].deadline-Date.now());},30000);
render();
</script>
